[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-qiita-analyze"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "plotly==5.24.1",
    "pandas==2.2.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "requests-mock==1.12.1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = ["integration: 複数モジュールをまたぐ統合テスト"]
